<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8" />

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
/>

<title>
  AI-Powered Flood Data Extraction — Thank You
</title>

<link
  href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
  rel="stylesheet"
/>

<style>

/* =========================================================
   ROOT / GLOBAL
========================================================= */

:root {

  --bg:
    #03101a;

  --cyan:
    #78dfff;

  --cyan2:
    #8bdfff;

  --muted:
    rgba(226,242,249,.62);

}


* {

  box-sizing:
    border-box;

}


html,
body {

  width:
    100%;

  height:
    100%;

  margin:
    0;

  overflow:
    hidden;

  background:
    var(--bg);

  color:
    white;

  font-family:
    "Inter",
    sans-serif;

}


/* =========================================================
   SLIDE
========================================================= */

.slide {

  position:
    relative;

  width:
    100vw;

  height:
    100vh;

  overflow:
    hidden;

  background:

    radial-gradient(
      circle at 50% 60%,
      rgba(31,140,180,.16),
      transparent 34%
    ),

    radial-gradient(
      circle at 50% 87%,
      rgba(31,140,180,.13),
      transparent 36%
    ),

    linear-gradient(
      180deg,
      #07131e 0%,
      #071923 48%,
      #06151d 100%
    );

}


/* =========================================================
   GRID
========================================================= */

.grid {

  position:
    absolute;

  inset:
    0;

  z-index:
    1;

  opacity:
    .07;

  background-image:

    linear-gradient(
      rgba(130,210,235,.16) 1px,
      transparent 1px
    ),

    linear-gradient(
      90deg,
      rgba(130,210,235,.16) 1px,
      transparent 1px
    );

  background-size:
    48px 48px;

}


/* =========================================================
   SKY GLOW
========================================================= */

.sky-glow {

  position:
    absolute;

  width:
    700px;

  height:
    360px;

  left:
    50%;

  top:
    38%;

  transform:
    translate(-50%,-50%);

  z-index:
    2;

  border-radius:
    50%;

  background:
    rgba(105,195,225,.10);

  filter:
    blur(110px);

}


/* =========================================================
   VIGNETTE
========================================================= */

.vignette {

  position:
    absolute;

  inset:
    0;

  z-index:
    7;

  pointer-events:
    none;

  background:

    linear-gradient(
      90deg,
      rgba(0,0,0,.18),
      transparent 45%,
      rgba(0,0,0,.10)
    ),

    radial-gradient(
      circle at center,
      transparent 48%,
      rgba(0,0,0,.30)
    );

}


/* =========================================================
   RAIN
========================================================= */

.rain {

  position:
    absolute;

  inset:
    0;

  z-index:
    4;

  overflow:
    hidden;

  pointer-events:
    none;

}


.rain-drop {

  position:
    absolute;

  top:
    -15vh;

  width:
    1px;

  height:
    48px;

  opacity:
    .16;

  transform:
    rotate(8deg);

  background:

    linear-gradient(
      transparent,
      rgba(210,240,255,.46)
    );

}


/* =========================================================
   WATER
========================================================= */

.water {

  position:
    absolute;

  z-index:
    5;

  left:
    0;

  right:
    0;

  bottom:
    0;

  height:
    14vh;

  overflow:
    hidden;

  background:

    linear-gradient(
      180deg,
      rgba(50,145,185,.22),
      rgba(5,48,75,.72)
    );

}


.wave {

  position:
    absolute;

  left:
    -8%;

  top:
    -22px;

  width:
    116%;

  height:
    60px;

}


.wave svg {

  width:
    100%;

  height:
    100%;

}


/* =========================================================
   TOP BAR
========================================================= */

.topbar {

  position:
    absolute;

  top:
    clamp(30px,4.7vh,56px);

  left:
    clamp(38px,5.5vw,95px);

  right:
    clamp(38px,5.5vw,95px);

  z-index:
    20;

  display:
    flex;

  justify-content:
    space-between;

  align-items:
    center;

}


.kicker {

  color:
    var(--cyan2);

  font-size:
    clamp(10px,.82vw,13px);

  font-weight:
    800;

  letter-spacing:
    .20em;

  text-transform:
    uppercase;

}


.brand {

  color:
    rgba(255,255,255,.30);

  font-size:
    clamp(9px,.72vw,11px);

  letter-spacing:
    .15em;

}


/* =========================================================
   MAIN CONTENT
========================================================= */

.main {

  position:
    absolute;

  z-index:
    20;

  inset:
    0;

  display:
    flex;

  flex-direction:
    column;

  align-items:
    center;

  justify-content:
    center;

  text-align:
    center;

  padding:
    0 8vw 8vh;

}


/* =========================================================
   THANK YOU
========================================================= */

.thank-you {

  opacity:
    0;

  transform:
    translateY(30px)
    scale(.96);

}


.small-label {

  color:
    var(--cyan2);

  font-size:
    clamp(10px,.78vw,13px);

  font-weight:
    800;

  letter-spacing:
    .18em;

  text-transform:
    uppercase;

}


h1 {

  margin:
    14px 0 0;

  font-size:
    clamp(72px,10vw,160px);

  line-height:
    .92;

  letter-spacing:
    -.065em;

  font-weight:
    900;

  color:
    white;

  text-shadow:

    0 0 50px
    rgba(120,223,255,.10);

}


h1 span {

  color:
    var(--cyan);

}


/* =========================================================
   MESSAGE
========================================================= */

.message {

  opacity:
    0;

  margin-top:
    clamp(20px,3vh,32px);

  max-width:
    780px;

  color:
    rgba(226,242,249,.64);

  font-size:
    clamp(14px,1.15vw,19px);

  line-height:
    1.55;

}


.message strong {

  color:
    white;

}


/* =========================================================
   DIVIDER
========================================================= */

.divider {

  opacity:
    0;

  width:
    0;

  height:
    1px;

  margin-top:
    clamp(28px,4vh,42px);

  background:

    linear-gradient(
      90deg,
      transparent,
      var(--cyan),
      transparent
    );

}


/* =========================================================
   PROJECT DETAILS
========================================================= */

.details {

  opacity:
    0;

  margin-top:
    clamp(22px,3vh,30px);

  display:
    flex;

  align-items:
    center;

  justify-content:
    center;

  flex-wrap:
    wrap;

  gap:
    12px 22px;

  color:
    rgba(226,242,249,.52);

  font-size:
    clamp(10px,.76vw,12px);

}


.detail-item {

  display:
    flex;

  align-items:
    center;

  gap:
    8px;

}


.detail-dot {

  width:
    6px;

  height:
    6px;

  border-radius:
    50%;

  background:
    var(--cyan);

  box-shadow:

    0 0 12px
    rgba(120,223,255,.65);

}


.details strong {

  color:
    rgba(255,255,255,.78);

}


/* =========================================================
   FINAL LINE
========================================================= */

.final-line {

  opacity:
    0;

  position:
    absolute;

  left:
    50%;

  bottom:
    clamp(25px,3.7vh,42px);

  transform:
    translateX(-50%);

  z-index:
    25;

  padding:
    9px 15px;

  border-radius:
    999px;

  border:
    1px solid
    rgba(120,223,255,.16);

  background:
    rgba(5,23,32,.86);

  color:
    rgba(227,244,251,.58);

  font-size:
    clamp(9px,.68vw,11px);

  white-space:
    nowrap;

  backdrop-filter:
    blur(10px);

}


.final-line strong {

  color:
    white;

}


/* =========================================================
   DECORATIVE RING
========================================================= */

.ring {

  position:
    absolute;

  left:
    50%;

  top:
    50%;

  z-index:
    8;

  width:
    clamp(350px,35vw,650px);

  height:
    clamp(350px,35vw,650px);

  transform:
    translate(-50%,-50%);

  border-radius:
    50%;

  border:
    1px solid
    rgba(120,223,255,.08);

  box-shadow:

    0 0 80px
    rgba(120,223,255,.025),

    inset 0 0 80px
    rgba(120,223,255,.025);

  pointer-events:
    none;

}


.ring::before {

  content:
    "";

  position:
    absolute;

  inset:
    9%;

  border-radius:
    50%;

  border:
    1px solid
    rgba(120,223,255,.045);

}


.ring::after {

  content:
    "";

  position:
    absolute;

  inset:
    20%;

  border-radius:
    50%;

  border:
    1px solid
    rgba(120,223,255,.03);

}

</style>

</head>


<body>


<div class="slide">


<!-- =====================================================
     BACKGROUND
===================================================== -->

<div class="grid"></div>

<div class="sky-glow"></div>

<div class="ring"></div>


<div
  class="rain"
  id="rain"
></div>


<div class="vignette"></div>


<div class="water">


<div class="wave">


<svg
  viewBox="0 0 1600 80"
  preserveAspectRatio="none"
>


<path

  d="
    M0,40
    C160,0 320,80 480,40
    C640,0 800,80 960,40
    C1120,0 1280,80 1440,40
    C1510,22 1560,25 1600,40
    L1600,80
    L0,80
    Z
  "

  fill="rgba(82,183,222,.52)"

/>


</svg>


</div>


</div>


<!-- =====================================================
     TOP
===================================================== -->

<div class="topbar">


<div class="kicker">

  

</div>


<div class="brand">

  AI-POWERED FLOOD DATA EXTRACTION

</div>


</div>


<!-- =====================================================
     MAIN
===================================================== -->

<div class="main">


<div
  class="thank-you"
  id="thankYou"
>


<div class="small-label">

  Thank you for listening

</div>


<h1>

  Thank <span>You.</span>

</h1>


</div>


<div
  class="message"
  id="message"
>

  <!-- From scattered flood reporting to a -->

  <strong>
    <!-- structured, searchable and evidence-linked dataset -->
  </strong>

  <!-- — and an application that makes that information easier to explore and understand. -->

</div>


<div
  class="divider"
  id="divider"
></div>


<div
  class="details"
  id="details"
>


<div class="detail-item">


<div class="detail-dot"></div>


<div>

  <strong>Omkar Joshi</strong>
  · Research Intern

</div>


</div>


<div class="detail-item">


<div class="detail-dot"></div>


<div>

  <strong>CRISiSLab Internship Project</strong>

</div>


</div>


<div class="detail-item">


<div class="detail-dot"></div>


<div>

  Funded by
  <strong>Natural Hazards Commission</strong>

</div>


</div>


</div>


</div>


<!-- =====================================================
     FINAL LINE
===================================================== -->

<div
  class="final-line"
  id="finalLine"
>

  <strong>Questions?</strong>
  · AI-Powered Flood Data Extraction

</div>


</div>


<!-- =====================================================
     GSAP
===================================================== -->

<script
  src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"
></script>


<script>

/* =========================================================
   RAIN
========================================================= */

const rain =
  document.getElementById(
    "rain"
  );


for (
  let i = 0;
  i < 55;
  i++
) {


  const drop =
    document.createElement(
      "div"
    );


  drop.className =
    "rain-drop";


  drop.style.left =
    Math.random()
    * 105
    + "%";


  drop.style.height =
    (
      20
      +
      Math.random()
      * 45
    )
    + "px";


  drop.style.opacity =
    .08
    +
    Math.random()
    * .22;


  rain.appendChild(
    drop
  );


  gsap.to(
    drop,
    {

      y:
        window.innerHeight
        * 1.35,

      x:
        60,

      duration:
        .9
        +
        Math.random()
        * .8,

      delay:
        Math.random()
        * 1.8,

      repeat:
        -1,

      ease:
        "none"

    }
  );


}


/* =========================================================
   WATER
========================================================= */

gsap.to(
  ".wave",
  {

    x:
      -85,

    duration:
      3.2,

    repeat:
      -1,

    yoyo:
      true,

    ease:
      "sine.inOut"

  }
);


/* =========================================================
   SUBTLE RING MOVEMENT
========================================================= */

gsap.to(
  ".ring",
  {

    scale:
      1.04,

    opacity:
      .75,

    duration:
      4,

    repeat:
      -1,

    yoyo:
      true,

    ease:
      "sine.inOut"

  }
);


/* =========================================================
   ENTRANCE
========================================================= */

function playEntrance() {


  gsap.set(
    "#thankYou",
    {

      opacity:
        0,

      y:
        30,

      scale:
        .96

    }
  );


  gsap.set(
    "#message",
    {

      opacity:
        0,

      y:
        14

    }
  );


  gsap.set(
    "#divider",
    {

      opacity:
        0,

      width:
        0

    }
  );


  gsap.set(
    "#details",
    {

      opacity:
        0,

      y:
        12

    }
  );


  gsap.set(
    "#finalLine",
    {

      opacity:
        0,

      y:
        8

    }
  );


  const tl =
    gsap.timeline();


  tl.to(
    "#thankYou",
    {

      opacity:
        1,

      y:
        0,

      scale:
        1,

      duration:
        .95,

      ease:
        "power3.out"

    },
    .15
  );


  tl.to(
    "#message",
    {

      opacity:
        1,

      y:
        0,

      duration:
        .65,

      ease:
        "power3.out"

    },
    .72
  );


  tl.to(
    "#divider",
    {

      opacity:
        1,

      width:
        "min(520px,42vw)",

      duration:
        .75,

      ease:
        "power2.out"

    },
    1.02
  );


  tl.to(
    "#details",
    {

      opacity:
        1,

      y:
        0,

      duration:
        .55,

      ease:
        "power3.out"

    },
    1.35
  );


  tl.to(
    "#finalLine",
    {

      opacity:
        1,

      y:
        0,

      duration:
        .50,

      ease:
        "power3.out"

    },
    1.70
  );


}


/* =========================================================
   START
========================================================= */

playEntrance();


/* =========================================================
   RESET
========================================================= */

function resetSlide() {


  gsap.killTweensOf(
    [
      "#thankYou",
      "#message",
      "#divider",
      "#details",
      "#finalLine"
    ]
  );


  playEntrance();


}


/* =========================================================
   KEYBOARD
========================================================= */

document.addEventListener(
  "keydown",
  event => {


    /*
       F = FULLSCREEN
    */

    if (
      event.key.toLowerCase()
      === "f"
    ) {


      if (
        !document.fullscreenElement
      ) {


        document
          .documentElement
          .requestFullscreen();


      }

      else {


        document
          .exitFullscreen();


      }


      return;


    }


    /*
       R = REPLAY
    */

    if (
      event.key.toLowerCase()
      === "r"
    ) {


      resetSlide();


      return;


    }


  }
);

</script>


</body>

</html>
